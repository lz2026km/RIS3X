apiVersion: v1
kind: ServiceAccount
metadata:
  name: g005-ris
  labels:
    app: g005-ris
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: g005-ris-pv
  labels:
    app: g005-ris
spec:
  capacity:
    storage: 50Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: standard
  hostPath:
    path: /data/g005-ris
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: g005-ris-pvc
  labels:
    app: g005-ris
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: standard
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: g005-ris
  labels:
    app: g005-ris
spec:
  replicas: 2
  selector:
    matchLabels:
      app: g005-ris
  template:
    metadata:
      labels:
        app: g005-ris
    spec:
      serviceAccountName: g005-ris
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: ris-backend
          image: g005/ris:3.0.6.11-15
          ports:
            - containerPort: 3001
            - containerPort: 5173
          envFrom:
            - configMapRef:
                name: g005-ris-config
            - secretRef:
                name: g005-ris-secret
          volumeMounts:
            - name: backup-storage
              mountPath: /data/backups
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
      volumes:
        - name: backup-storage
          persistentVolumeClaim:
            claimName: g005-ris-pvc
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - g005-ris
                topologyKey: kubernetes.io/hostname
---
apiVersion: v1
kind: Service
metadata:
  name: g005-ris-service
spec:
  selector:
    app: g005-ris
  ports:
    - name: api
      protocol: TCP
      port: 3001
      targetPort: 3001
    - name: frontend
      protocol: TCP
      port: 5173
      targetPort: 5173
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: g005-ris-ingress
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "200m"
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - ris.g005.local
      secretName: g005-ris-tls
  rules:
    - host: ris.g005.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: g005-ris-service
                port:
                  number: 3001
          - path: /
            pathType: Prefix
            backend:
              service:
                name: g005-ris-service
                port:
                  number: 5173
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: g005-ris-pdb
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: g005-ris
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: g005-ris-network-policy
spec:
  podSelector:
    matchLabels:
      app: g005-ris
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - port: 3001
        - port: 5173
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - port: 443
        - port: 80
        - port: 5432
        - port: 6379
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: g005-ris-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: g005-ris
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: g005-ris-config
data:
  NODE_ENV: production
  PORT: "3001"
  LOG_LEVEL: info
  BACKUP_DIR: /data/backups
---
apiVersion: v1
kind: Secret
metadata:
  name: g005-ris-secret
type: Opaque
stringData:
  JWT_SECRET: "change-me-in-production"
  DB_PASSWORD: "change-me-in-production"
