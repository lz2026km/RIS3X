replicaCount: 2

image:
  repository: g005/ris
  tag: 3.0.6.11-15
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 3001
  frontendPort: 5173

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
  tls:
    - hosts:
        - ris.g005.local
      secretName: g005-ris-tls
  hosts:
    - host: ris.g005.local
      paths:
        - path: /api
          pathType: Prefix
        - path: /
          pathType: Prefix

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

secrets:
  jwtSecret: "change-me-in-production"
  dbPassword: "change-me-in-production"
  tlsCrt: ""
  tlsKey: ""

env:
  - name: NODE_ENV
    value: production
  - name: PORT
    value: "3001"

persistence:
  enabled: true
  storageClass: standard
  accessMode: ReadWriteOnce
  size: 10Gi

probes:
  livenessPath: /api/health
  readinessPath: /api/health
  initialDelaySeconds: 10
  periodSeconds: 30

nodeSelector: {}
tolerations: []
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - g005-ris
          topologyKey: kubernetes.io/hostname
