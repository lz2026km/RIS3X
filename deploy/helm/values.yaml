replicaCount: 2

image:
  repository: g005/ris-backend
  tag: 3.0.6.11-82
  pullPolicy: IfNotPresent

imagePullSecrets: []

frontend:
  enabled: true
  image:
    repository: g005/ris-frontend
    tag: 3.0.6.11-82
    pullPolicy: IfNotPresent
  port: 8080
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

service:
  type: ClusterIP
  port: 3001
  frontendPort: 80

ingress:
  enabled: true
  className: nginx
  certManager:
    enabled: false
    clusterIssuer: letsencrypt-prod
  annotations:
    - hosts:
        - ris.g005.local
      secretName: g005-ris-tls
  hosts:
    - host: ris.g005.local
      paths:
        - path: /api
          pathType: Prefix
        - path: /
          pathType: Prefix

tlsSecret:
  create: false
  cert: ""
  key: ""

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

secrets:
  create: false
  existingSecret: ""
  jwtSecret: ""
  dbPassword: ""

env:
  - name: NODE_ENV
    value: production
  - name: PORT
    value: "3001"

persistence:
  enabled: true
  existingClaim: ""
  storageClass: standard
  accessMode: ReadWriteOnce
  size: 10Gi

monitoring:
  serviceMonitor:
    enabled: true
    namespace: ""
    interval: 30s
    scrapeTimeout: 10s

networkPolicy:
  ingressNamespaces:
    - ingress-nginx
    - monitoring
  egressNamespaces:
    - kube-system

pdb:
  create: true

probes:
  livenessPath: /api/health
  readinessPath: /api/health
  initialDelaySeconds: 10
  periodSeconds: 30

nodeSelector: {}
tolerations: []
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - g005-ris
          topologyKey: kubernetes.io/hostname
