{{- if and .Values.ingress.tls .Values.tlsSecret.create }}
{{- $root := . }}
{{- range $i, $tls := .Values.ingress.tls }}
{{- if $i }}---
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $tls.secretName }}
  labels:
    {{- include "g005-ris.labels" $root | nindent 4 }}
type: kubernetes.io/tls
stringData:
  tls.crt: {{ required "tlsSecret.cert is required when tlsSecret.create is true" $root.Values.tlsSecret.cert | quote }}
  tls.key: {{ required "tlsSecret.key is required when tlsSecret.create is true" $root.Values.tlsSecret.key | quote }}
{{- end }}
{{- end }}
