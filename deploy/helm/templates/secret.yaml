{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "g005-ris.fullname" . }}-secret
  labels:
    {{- include "g005-ris.labels" . | nindent 4 }}
type: Opaque
stringData:
  JWT_SECRET: {{ required "secrets.jwtSecret is required when secrets.create is true" .Values.secrets.jwtSecret | quote }}
  DB_PASSWORD: {{ required "secrets.dbPassword is required when secrets.create is true" .Values.secrets.dbPassword | quote }}
{{- end }}
