apiVersion: v1
kind: Secret
metadata:
  name: {{ include "g005-ris.fullname" . }}-secret
  labels:
    {{- include "g005-ris.labels" . | nindent 4 }}
type: Opaque
stringData:
  JWT_SECRET: "{{ .Values.secrets.jwtSecret | default "change-me-in-production" }}"
  DB_PASSWORD: "{{ .Values.secrets.dbPassword | default "change-me-in-production" }}"
