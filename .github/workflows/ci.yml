# G005 放射RIS系统 v3.0.0 - 完整 CI/CD 流水线
# Phase T4-W10: 7 步 + 缓存 + 矩阵

name: CI

on:
  push:
    branches: [main, develop, 'feature/**', 'release/**', 'v3.x']
  pull_request:
    branches: [main, develop]
  schedule:
    # 每周一次依赖审计
    - cron: '0 9 * * 1'

# 取消旧运行
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  # ============================================================
  # 1. Lint
  # ============================================================
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: ${{ env.NODE_VERSION }}, cache: 'pnpm' }
      - name: Install pnpm
        run: npm install -g pnpm@9
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  # ============================================================
  # 2. TypeScript 类型检查
  # ============================================================
  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: ${{ env.NODE_VERSION }}, cache: 'pnpm' }
      - name: Install pnpm
        run: npm install -g pnpm@9
      - run: pnpm install --frozen-lockfile
      - run: npx tsc --noEmit

  # ============================================================
  # 3. 单元测试 + 覆盖率
  # ============================================================
  test:
    name: Unit Tests
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: ${{ env.NODE_VERSION }}, cache: 'pnpm' }
      - name: Install pnpm
        run: npm install -g pnpm@9
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:run -- --coverage --reporter=junit --reporter=default
      - uses: codecov/codecov-action@v4
        if: always()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          flags: unittests
          fail_ci_if_error: false
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ matrix.os }}
          path: coverage/

  # ============================================================
  # 4. 构建
  # ============================================================
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: ${{ env.NODE_VERSION }}, cache: 'pnpm' }
      - name: Install pnpm
        run: npm install -g pnpm@9
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # ============================================================
  # 5. E2E (Playwright)
  # ============================================================
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: ${{ env.NODE_VERSION }}, cache: 'pnpm' }
      - name: Install pnpm
        run: npm install -g pnpm@9
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/

  # ============================================================
  # 6. Lighthouse CI
  # ============================================================
  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: ${{ env.NODE_VERSION }}, cache: 'pnpm' }
      - name: Install pnpm
        run: npm install -g pnpm@9
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Run Lighthouse CI
        run: npx lhci autorun || true
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

  # ============================================================
  # 7. 安全 + 依赖审查
  # ============================================================
  security:
    name: Security & Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: ${{ env.NODE_VERSION }}, cache: 'pnpm' }
      - name: Install pnpm
        run: npm install -g pnpm@9
      - run: pnpm install --frozen-lockfile
      - name: npm audit
        run: npm audit --audit-level=high
      - name: Outdated dependencies
        run: npm outdated --json || true
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
          format: 'sarif'
          output: 'trivy-fs.sarif'
      - name: Upload Trivy results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-fs.sarif'

  # ============================================================
  # 8. 总状态汇总
  # ============================================================
  all-green:
    name: All Checks
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, build, e2e, lighthouse, security]
    if: always()
    steps:
      - name: Summary
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "❌ Some checks failed:"
            echo "${{ toJSON(needs) }}"
            exit 1
          fi
          echo "✅ All checks passed"
